# 설정은 이 파일 하나에서만 고침
# 환경변수가 우선 (예: TARGET_DEPTH_READS=50000 python 2_train/steps/08_ML_classifier.py)

# 경로
# 산출물 뿌리 (아래에 results/, sample_data/ 생김)
METH_ROOT=/ssd_data/Methylation

# 원시 자료 (학습용 세포주 cov, bam 등)
DATASET_ROOT=/ssd_data/dataset

# 뿌리 아래 폴더 구조가 다르면 환경변수로 옮김 (코드 수정 불필요)
#   이 파일에 키로 적지 말 것 - meth_config 가 모르는 키라 셸 드라이버에서만 먹음
#   명령 앞에 붙여서 사용
#
#       NORMAL_SET=<정상 cov 폴더> CANCER_COV_DIR=<암 cov 폴더> \
#       NORMAL_BAM_DIR=<정상 BAM 폴더> CANCER_BAM_DIR=<암 BAM 폴더> \
#       bash 1_dmr/run_dmr.sh
#
#     읽는 단계: NORMAL_SET, CANCER_COV_DIR -> 01, 02, 03
#                NORMAL_BAM_DIR, CANCER_BAM_DIR -> 03, 11
#     옛 이름 GBM_COV_DIR, GBM_BAM_DIR, USE_GBM 도 받음 (새 이름과 둘 다 주면 같아야 함)

# 검증이 검체마다 만드는 작업 폴더의 부모
WORK_ROOT=$HOME

# 로그, 잠금
TMP_ROOT=$HOME/tmp

# 검증이 검체 폴더로 복사할 학습 스크립트 원본 위치
# 아래에 판 이름 폴더 있으면 그것, 없으면 이 폴더 그대로 사용
# 비우면 이 저장소의 2_train/steps 사용
TRAIN_SRC=

# make_val_config.py 위치 (비우면 이 저장소의 3_validate/steps)
ANALYSIS_DIR=

# 자료 폴더(정상/암 cov, BAM, 게놈 인덱스, 코호트)는 여기 안 둠
#   각 스크립트 맨 앞 경로 블록이 위 두 뿌리로 조립
#   배치가 다르면 위 환경변수(NORMAL_SET, CANCER_COV_DIR, NORMAL_BAM_DIR, CANCER_BAM_DIR, COHORT_DIR)로 옮김

# 패널 세대
# 패널 산출 폴더 접미사 (results/dmr/j_candidates15, j_jsdcount15, j_jsd15, j_panel15, j_pool15_*)
# 비우면 meth_config.py 기본값 15. 세대 섞이지 않게 꼭 채움
GEN=15

# 판 명단
# 판 이름: j + GEN + <명단 항목> + _<깊이>_uni
#   명단은 세대마다 달라서 여기 한 곳에 둠 (표, 감시, 귀무 사슬이 같이 씀)
# 이 세대 판에 허용할 코호트 (3_validate/run_validate.sh 관문이 봄, 옛 코호트나 오타 차단용)
#   비우면 아무 코호트나 허용. 시험용 코호트는 여기에 추가
VAL_COHORTS=

PANELS=bl200,jsd200,jsdb200
NULL_PANELS=rand1200,rand2200,rand3200,randb1200,randb2200,randb3200

# 패널 블록 수. 바꾸면 위 두 줄과 아래 VERSION, PANEL 이름의 숫자도 같이 바꿈 (예 300: bl300, rand1300)
PANEL_N=200
# bl 안정성 빈도를 셀 때 중요도 상위 몇 개까지 볼지. 1000 = 발표한 표. N 이면 PANEL_N 과 같게 (size_cv 와 같은 조건)
TOPCAP=1000

# 돌릴 판
# VERSION 은 <접두>_<리드수>_<집계>, PANEL 은 DMR 패널 이름
VERSION=j15bl200_5k_uni
PANEL=bl200

# 리드 수
# 검체 하나를 맞출 리드 수 (5k, 50k, 100k)
# VERSION 이름과 따로 놀아서 둘 다 같이 고침 (5k -> 50k 면 50000)
TARGET_DEPTH_READS=5000

# total = 총 리드 수 맞춤, per_block = 블록별 조각 수 맞춤
#   (코드는 이 둘만 받음, cov 는 안 받음)
DEPTH_MODE=total

# 섞는 비율
# 종양 비율, 쉼표 구분 (0 은 음성판, 1.0 은 100% 판)
MUT_RATIOS=0.0,0.001,0.005,0.01,0.02,0.025,0.03,0.05,0.1,1.0

# 창과 문턱
# 무늬 자리 수 (3이면 2^3=8가지)
PATTERN_K=3

# 창 하나에 필요한 최소 조각 수
MIN_READS_PER_WINDOW=6

# 블록 크기 (염기)
BLOCK_SIZE=100

# 검체가 블록을 덮어야 하는 최소 비율
MIN_SAMPLE_COVERAGE=0.8

# 학습에서 쓸 칸(05 블록, 06 jsd, pdr 창)을 어느 행 커버율로 정할지
#   all     정상 + 암 행 전부 (results/ 표를 낸 설정)
#   normal  학습 정상 행만 (칸 선택이 암 행을 안 봄)
#   검증은 학습이 남긴 칸 목록을 받아서 이 값과 무관
#   출력 폴더 이름은 이 값으로 안 갈림. 둘을 비교하려면 METH_ROOT 따로 줌
COLSET_FROM=all

# BLAS 스레드 수 (진입점 run_*.sh, make_report.sh 가 OMP, OPENBLAS, MKL 에 내보냄)
#   로지스틱 회귀 값이 스레드 수 따라 달라짐
#   none 이면 고정 안 함 (results/ 표를 낸 실행은 none)
BLAS_THREADS=1

# 검증 점수 단위. 채점은 검체 안 확률이 1.0 에 뭉치면 그 검체만 decision_function 으로 바꿈
#   as_is       그대로 (results/ 표를 낸 설정, 한 칸 안에 단위가 섞일 수 있음)
#   consistent  채점이 y_df 열도 적고, decision_function 있는 모형(LR, SVM)은 늘 그 값 사용
#               부분 포화(일부 행만 1.0 에 붙은 동률)도 없앰. RF, XGB 는 확률 그대로
#               바꾸면 검증 다시 채점해야 함
SCORE_UNIT=as_is

# 성능 표(4단계)에 대조 줄(기준선) 붙일지. 판정엔 안 씀
#   값은 같은 깊이, 같은 뽑기로 만든 mean 특징 표의 패널 블록 평균 메틸화의 평균
#   전역 평균 아님 - DMR 블록만이라 암 신호가 이미 들어 있음
#   방향은 같은 판 학습 mean 표로 정함 (검증 라벨 안 봄)
#   패널 점수가 이 줄보다 낫지 않으면 블록 평균 하나 이상을 못 더한 것
REPORT_BASELINE=off

# 학습
SEED=42
TEST_SIZE=0.2
N_JOBS=1

# 2단계 08, 09 끝에 수렴 경고(ConvergenceWarning) 건수 출력. on 이면 1건이라도 있으면 그 단계 실패
#   수렴 안 한 로지스틱 회귀는 BLAS 스레드 수 따라 값이 달라져 재현이 흔들림
CONVERGENCE_GATE=off

# 모델 고정. 비우면 LR, RF, XGB, SVM 을 교차검증으로 겨뤄 1등 사용
#   이름: Logistic Regression, Random Forest, XGBoost, SVM
#   고르기는 학습 CV 로만 해서 외부 검증 AUC 는 안 부풂. 학습 CV 값은 4개 중 최고라 그만큼 높음
FIXED_MODEL=

# LLR 참조표 공여자와 학습 풀(섞기) 공여자를 가름
#   0 이면 같은 사람이 양쪽에 들어가 학습 CV 가 부풂
#   바꾸면 1단계 05(참조표), 11(풀)부터 다시 돌림
LLR_HELDOUT=1

# 검증이 도는 단계와 원본 파일 (세미콜론 구분)
# 왼쪽(val03_1 ...)은 검체 폴더에 놓일 이름. run_one_sample.sh 가 그 순서로 돌아서 안 바꿈
# 파일명 바뀌면 오른쪽만 고침. 단계 추가는 왼쪽, 오른쪽 짝으로
#   오른쪽 파일이 2_train/steps/ 에 실제로 있어야 함 (없으면 검체마다 멈춤)
STEP_MAP="val03_1:01_Preprocessing_for_ML_RawData_Mixing.py;val03_2:02_Preprocessing_for_ML_RawData_Mixing.py;val03_3:03_Preprocessing_for_ML_RawData_Mixing.py;val04_0:04_coverage_check.py;val04_1:05_Feature_Matrix.py;val04_1c:06_jsdfeat.py;val04_1d:07_llrfeat.py"
