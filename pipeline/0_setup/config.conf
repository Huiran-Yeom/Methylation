# 고치는 곳은 여기 하나다. 다른 파일은 손대지 않는다.
# 환경변수를 주면 그쪽이 이긴다:  TARGET_DEPTH_READS=50000 python 2_train/steps/08_ML_classifier.py

# ── 경로 ──
# 산출물이 쌓이는 뿌리. 이 아래에 results/ 와 sample_data/ 가 생긴다.
METH_ROOT=/ssd_data/Methylation

# 원시 자료(학습용 세포주 cov·bam 등).
DATASET_ROOT=/ssd_data/dataset

# 뿌리 아래 폴더 구조가 다르면 「환경변수」 로 옮긴다. 코드를 안 고쳐도 된다.
#   같은 값이 단계 두세 곳에 적혀 있어, 손으로 고치면 하나를 빠뜨리기 쉽다.
#   ※ 이 파일에 키로 적지 말 것. 여기 적으면 meth_config 가 모르는 키가 되고,
#     셸 드라이버를 거칠 때만 먹는다. 명령 앞에 붙여 준다:
#
#       NORMAL_SET=<정상 cov 폴더> GBM_COV_DIR=<암 cov 폴더> \
#       NORMAL_BAM_DIR=<정상 BAM 폴더> GBM_BAM_DIR=<암 BAM 폴더> \
#       bash 1_dmr/run_dmr.sh
#
#     읽는 단계: NORMAL_SET·GBM_COV_DIR -> 01·02·03
#                NORMAL_BAM_DIR·GBM_BAM_DIR -> 03·11

# 검증이 검체마다 만드는 작업 폴더의 부모.
WORK_ROOT=$HOME

# 로그·잠금.
TMP_ROOT=$HOME/tmp

# 검증이 검체 폴더로 복사해 쓸 「학습 스크립트 원본」 이 있는 곳.
# 이 폴더 아래에 판 이름 폴더가 있으면 그것을, 없으면 이 폴더를 그대로 쓴다.
# 비우면 이 저장소의 2_train/steps 를 쓴다. 다른 자리를 쓰려면 채운다.
TRAIN_SRC=

# make_val_config.py 가 있는 곳.
# 비우면 이 저장소의 3_validate/steps 를 쓴다.
ANALYSIS_DIR=

# ── 자료 폴더는 여기에 두지 않습니다 ──
#   정상 cov·암 cov·BAM·게놈 인덱스·코호트 폴더는 「각 스크립트 맨 앞」
#   의 「경로」 블록에서 위 두 뿌리로 조립합니다. 그 단계가 무엇을 읽고 쓰는지
#   그 파일만 열면 보이게 하려는 것입니다. 배치가 다르면 그 블록을 고칩니다.
#   여기(0단계)에는 「뿌리와 실험 설정」 만 둡니다.

# ── 패널 세대 ──
# 패널 산출물 폴더의 접미사. 지금 쓰는 것은 15 세대다:
#   results/dmr/j_candidates15 · j_jsdcount15 · j_jsd15 · j_panel15 · j_pool15_*
# 비워도 meth_config.py 의 기본값 15 가 된다. 세대를 섞지 않도록 반드시 채워 둔다.
GEN=15

# ── 판 명단 ──
# 판 이름은 「접두 + 명단」 이다:  j + GEN + <명단 항목> + _<깊이>_uni
#   접두(j·GEN)는 세대라서 GEN 이 정한다. 명단은 자료라서 여기 적는다.
#   세대마다 명단이 다르므로 GEN 만으로는 못 만든다.
#   표·감시·귀무사슬이 쓰는 명단은 여기 한 곳에만 둔다.
# 이 세대 판에 쓸 수 있는 코호트. 3_validate/run_validate.sh 의 관문이 이 목록을 본다.
#   옛 코호트나 오타를 막으려고 둔 관문이다. 비우면 아무 코호트나 허용한다.
#   시험용 코호트를 쓰려면 여기에 더한다. 코드를 고치지 않는다.
VAL_COHORTS=

PANELS=bl200,jsd200,jsdb200
NULL_PANELS=rand1200,rand2200,rand3200,randb1200,randb2200,randb3200

# ── 어느 판을 도는가 ──
# VERSION 은 <접두>_<리드수>_<집계> 꼴이다. PANEL 은 DMR 패널 이름.
VERSION=j15bl200_5k_uni
PANEL=bl200

# ── 리드 수 ──
# 검체 하나를 몇 리드로 맞출 것인가. 5k·50k·100k 를 이 값으로 바꾼다.
# VERSION 이름과 따로 도니 둘을 같이 고친다 (5k -> 50k 면 50000).
TARGET_DEPTH_READS=5000

# total = 총 리드 수를 맞춘다.  per_block = 블록별 조각 수를 맞춘다.
#   (코드는 이 둘만 받는다. cov 는 받지 않는다)
DEPTH_MODE=total

# ── 섞는 비율 ──
# 종양 비율. 0 은 음성판, 1.0 은 100% 판이다. 쉼표로 나눈다.
MUT_RATIOS=0.0,0.001,0.005,0.01,0.02,0.025,0.03,0.05,0.1,1.0

# ── 창과 문턱 ──
# 무늬를 몇 자리로 볼 것인가. 3이면 2^3=8가지.
PATTERN_K=3

# 창 하나를 쓰려면 조각이 최소 몇 개 있어야 하는가.
MIN_READS_PER_WINDOW=6

# 블록 크기(염기).
BLOCK_SIZE=100

# 검체가 블록의 몇 할을 덮어야 쓰는가.
MIN_SAMPLE_COVERAGE=0.8

# 학습에서 쓸 칸(05 의 블록 · 06 의 jsd · pdr 창)을 어느 행의 커버율로 정하는가.
#   all     정상 + 암 섞인 행 전부 (results/ 의 표를 낸 동작)
#   normal  학습 정상 행만 — 칸 선택이 암 행을 보지 않는다
#   검증은 학습이 남긴 칸 목록을 받으므로 이 값의 영향을 받지 않는다.
#   주의: 출력 폴더 이름은 이 값으로 갈리지 않는다. 둘을 비교하려면 METH_ROOT 를 따로 준다.
COLSET_FROM=all

# 수치 연산(BLAS) 스레드 수. 진입점(run_*.sh · make_report.sh)이 OMP · OPENBLAS · MKL 에 내보낸다.
#   로지스틱 회귀 값이 스레드 수에 따라 달라진다.
#   none 이면 고정하지 않는다(results/ 의 e8d5fe5d 표를 낸 실행이 그랬다).
BLAS_THREADS=1

# 검증 점수의 단위. 채점은 검체 안에서 확률이 1.0 에 뭉치면 그 검체만 decision_function 으로 바꾼다.
#   as_is       그대로 둔다(results/ 의 표를 낸 동작 · 한 칸 안에 단위가 섞일 수 있다)
#   consistent  채점이 y_df 열을 같이 적고, decision_function 이 있는 모형(LR · SVM)은 판 · 조합마다 늘 그 값으로 맞춘다.
#               전환이 없어도 바꿔 부분 포화(일부 행만 1.0 에 붙은 동률)도 없앤다. RF · XGB 는 확률 그대로다.
#               (consistent 로 바꾸면 검증을 다시 채점해야 한다)
SCORE_UNIT=as_is

# 성능 표(4단계)에 대조 줄(기준선)을 붙이는가. 판정에 쓰지 않는다.
#   값은 패널 점수와 같은 깊이 · 같은 뽑기로 만든 mean 특징 표의 「패널 블록 평균 메틸화의 평균」 하나다.
#   전역 평균 메틸화가 아니다 — DMR 로 고른 블록만이라 암 신호가 이미 들어 있다(뽑은 리드의 cov 가
#   남지 않아 전역 평균은 낼 수 없다). 방향은 같은 판 학습 mean 표에서 정한다(검증 라벨을 보지 않는다). 패널 점수가 이 줄보다 낫지 않으면
#   패널 점수가 블록 평균 하나 이상을 더하지 못한 것이다.
REPORT_BASELINE=off

# ── 학습 ──
SEED=42
TEST_SIZE=0.2
N_JOBS=1

# 2단계 08 · 09 끝에 수렴 경고(ConvergenceWarning) 건수를 찍는다. on 이면 1건이라도 있을 때 그 단계가 실패로 끝난다.
#   수렴하지 않은 로지스틱 회귀는 BLAS 스레드 수에 따라 값이 달라져 재현이 흔들린다(results/README.md).
CONVERGENCE_GATE=off

# 모델을 미리 하나로 고정한다. 비우면 LR·RF·XGB·SVM 을 교차검증으로 겨뤄 1등을 쓴다.
#   이름: Logistic Regression · Random Forest · XGBoost · SVM
#   최고 모델을 쓴다(비워 둔다). 고르기는 학습 CV 로만 하므로 외부
#   검증 AUC 는 이 선택에 부풀지 않는다. 다만 학습 CV 값은 「4개 중 최고」 라 그만큼 올라 있다
#   (신호가 없어도 +0.03~0.04).
FIXED_MODEL=

# LLR 참조표를 만드는 공여자와 학습 풀(섞기)에 쓰는 공여자를 가른다.
#   0 이면 같은 사람이 참조표와 학습 양쪽에 들어가 학습 CV 가 부풀려진다.
#   1 로 바꾸면 1단계 05(참조표)·11(풀)부터 다시 돌려야 한다.
LLR_HELDOUT=1

# ── 검증이 도는 단계와 그 원본 파일 ──
# 세미콜론으로 나눈다. 파일명을 바꾸면 오른쪽만 고친다.
# 왼쪽(val03_1 …)은 검체 폴더에 놓일 이름이라 바꾸지 않는 편이 낫다 —
# run_one_sample.sh 가 그 이름 순서로 돈다.
# 단계를 더하려면 왼쪽(val…)·오른쪽(파일명) 짝을 여기에 더한다. 오른쪽 파일이
#   2_train/steps/ 에 「실제로 있어야」 한다. 없으면 검증이 검체마다 멈춘다.
#   (readent·mhl 을 되살리려던 step04_1b_readfeat.py 는 이 저장소에 없다.)
STEP_MAP="val03_1:01_Preprocessing_for_ML_RawData_Mixing.py;val03_2:02_Preprocessing_for_ML_RawData_Mixing.py;val03_3:03_Preprocessing_for_ML_RawData_Mixing.py;val04_0:04_coverage_check.py;val04_1:05_Feature_Matrix.py;val04_1c:06_jsdfeat.py;val04_1d:07_llrfeat.py"
